# Render（無料プラン）とSupabase（無料プラン）が使われずに眠ったり止まったりしないよう、
# 10分おきにサーバーへアクセスする。毎回ちがう部屋名にして、Supabaseまで読みに行かせる。
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping server and database
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 \
            "https://kankyakuseki.onrender.com/api/config?room=keep-$(date +%s)"
          echo
          curl -fsS --max-time 30 "https://kankyakuseki.onrender.com/api/status"
